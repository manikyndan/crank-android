name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Build BOTH variants. The release build is where R8 and resource shrinking
      # run, so it catches missing keep rules that a debug-only build never
      # exercises — which is exactly how the release build stayed broken unnoticed.
      - name: Build with Gradle
        run: ./gradlew assembleDebug assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # Release signing is driven by keystore.properties, which is git-ignored and
      # therefore absent in CI. The build still succeeds and emits an unsigned APK;
      # it just isn't publishable. Wire up signing here via repository secrets when
      # a real keystore exists.
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
