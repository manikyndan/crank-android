name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Build BOTH variants. The release build is where R8 and resource shrinking
      # run, so it catches missing keep rules that a debug-only build never
      # exercises — which is exactly how the release build stayed broken unnoticed.
      - name: Build with Gradle
        run: ./gradlew assembleDebug assembleRelease

      # Room exports its schema to app/schemas on every build that changes the
      # database. Those files are the record that migrations are verified
      # against, so an uncommitted one means the checked-in migration tests no
      # longer describe the real schema. Fail instead of silently drifting.
      - name: Check Room schemas are committed
        shell: bash
        run: |
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            echo "::error::app/schemas changed during the build but was not committed."
            git status --porcelain app/schemas
            git diff -- app/schemas | head -50
            echo "Commit the updated schema alongside the entity change."
            exit 1
          fi
          echo "Room schemas are in sync."

      # Run the JVM unit tests. Without this step a change that breaks the pure
      # logic (the stream-URL expiry rules, for example) still produces a green
      # check, because assembleDebug does not compile or execute src/test.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      # Android Lint. Run as a REPORT first, not a gate: the step is `continue-on-error` so the
      # current findings surface without failing an otherwise-good build. Once the report is
      # clean, delete `continue-on-error` to make new lint errors block the PR.
      #
      # Note this is lint for the debug variant; `lintRelease` would also exercise the R8/shrinker
      # configuration, but `assembleRelease` above already compiles that path.
      - name: Run Android Lint (report only)
        continue-on-error: true
        run: ./gradlew lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore

      # connectedCheck (instrumented tests) is intentionally NOT wired here: the emulator action
      # it needs only supports Linux/macOS runners, and this job is `windows-latest`. Add a
      # separate ubuntu-latest job with reactivecircus/android-emulator-runner to run
      # `connectedDebugAndroidTest` (the tests already live in app/src/androidTest).

      # Surface the JUnit XML so a failure names the assertion, instead of only
      # reporting an exit code.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # Release signing is driven by keystore.properties, which is git-ignored and
      # therefore absent in CI. The build still succeeds and emits an unsigned APK;
      # it just isn't publishable. Wire up signing here via repository secrets when
      # a real keystore exists.
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
